<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Builder Summit 9.0 — Kickoff Call Slides</title>
<!--
  PBS 9.0 — Kickoff call slide deck (ONE call for the whole week, not daily)
  ===========================================================================
  Built to match the attendee hub / schedule page branding (same colors,
  fonts, components) rather than the old PBS 8.0 deck's design — but the
  CONTENT FLOW follows that old deck closely: welcome -> where to find
  links -> where to find live sessions -> the week's schedule -> speaker
  thanks -> sponsors (tiered) -> the week's bingo prizes -> reminder ->
  sign-off.

  PBS 9.0 runs this as a SINGLE kickoff call (no daily calls like 8.0 had),
  so the schedule and bingo sections cover the whole week at once rather
  than "today's" content. All of that content lives in the WEEK array near
  the top of the script (search "WEEK =") if it ever needs updating.
  Sponsor slides are intentionally left as placeholders; there was no
  PBS 9.0 sponsor list available when this was built.

  NAVIGATION: arrow keys / click the left-right edges / on-screen buttons /
  dot indicators at the bottom. Press "F" for fullscreen (handy when
  screen-sharing on the call). Built for 16:9 presentation, not a public
  page — not intended for mobile/responsive polish.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #D85A95;
    --pink-dark: #CC4E89;
    --blue: #25AAE1;
    --blue-dark: #199ED5;
    --navy: #312E61;
    --teal: #75B8A1;
    --teal-dark: #5FA088;
    --white: #ffffff;
    --off-white: #FBFCFE;
    --light-blue: #E2F0FB;
    --text-light: rgba(255,255,255,0.85);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: 'Open Sans', sans-serif; background: var(--navy);
  }
  h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; margin: 0; }

  /* ---------- Deck shell ---------- */
  .deck { position: relative; width: 100%; height: 100vh; }
  .slide {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 6vh 8vw;
  }
  .slide.active { display: flex; }

  /* Slide background themes — no dark navy backgrounds */
  .theme-skyblue { background: var(--light-blue); color: var(--navy); }
  .theme-pink   { background: linear-gradient(135deg, var(--pink) 0%, var(--pink-dark) 100%); color: #fff; }
  .theme-light  { background: var(--off-white); color: var(--navy); }
  .theme-teal   { background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%); color: #fff; }

  .eyebrow {
    font-family: 'Montserrat', sans-serif; font-size: clamp(13px, 1.4vw, 16px); font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase; opacity: 0.85; margin-bottom: 18px;
  }
  .theme-light .eyebrow, .theme-skyblue .eyebrow { color: var(--pink-dark); }

  .slide h1 { font-size: clamp(34px, 5.5vw, 76px); font-weight: 900; line-height: 1.08; }
  .slide h2 { font-size: clamp(26px, 3.6vw, 48px); font-weight: 800; line-height: 1.15; }
  .slide .sub { font-size: clamp(16px, 1.8vw, 24px); font-weight: 500; margin-top: 18px; opacity: 0.92; max-width: 900px; }
  .slide .big-url {
    font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: clamp(22px, 3.2vw, 42px);
    margin-top: 28px; padding: 14px 32px; border-radius: 999px; background: rgba(255,255,255,0.14);
    letter-spacing: 0.5px; word-break: break-word;
  }
  .theme-light .big-url, .theme-skyblue .big-url { background: rgba(49,46,97,0.08); color: var(--navy); }

  .logo-row img { height: 52px; margin-bottom: 28px; }

  /* ---------- Schedule slides (one per day) ---------- */
  .sched-wrap { width: 100%; max-width: 1150px; text-align: left; }
  .sched-head { text-align: center; margin-bottom: 4px; }
  .sched-date { text-align: center; font-size: clamp(14px, 1.3vw, 17px); opacity: 0.85; margin-bottom: 26px; }
  .sched-list { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 36px; }
  .sched-list.dense { columns: 2; font-size: 0.92em; }
  .sched-list li {
    break-inside: avoid; font-size: clamp(13px, 1.15vw, 17px); line-height: 1.45; margin-bottom: 11px; padding-left: 18px; position: relative;
  }
  .sched-list li::before { content: "▸"; position: absolute; left: 0; color: var(--pink); font-weight: 800; }
  .sched-list strong { color: var(--navy); font-family: 'Montserrat', sans-serif; font-weight: 700; }
  .sched-list .who { color: var(--pink-dark); font-weight: 600; }
  .sched-count { text-align: center; font-size: 13px; opacity: 0.6; margin-top: 18px; }

  /* ---------- Live highlights (on the "where to find live" slide) ---------- */
  .live-box {
    background: rgba(255,255,255,0.6); border-radius: 16px; padding: 20px 28px; margin-top: 28px; max-width: 620px; text-align: left;
  }
  .live-box h3 {
    font-size: clamp(14px, 1.3vw, 17px); font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    color: var(--pink-dark); margin-bottom: 12px; text-align: center;
  }
  .live-item { display: flex; justify-content: space-between; gap: 20px; align-items: baseline; padding: 7px 0; border-top: 1px solid rgba(49,46,97,0.12); }
  .live-item:first-of-type { border-top: none; }
  .live-item .what { font-size: clamp(13px, 1.1vw, 16px); font-weight: 600; color: var(--navy); }
  .live-item .when { font-size: clamp(11px, 0.95vw, 13px); opacity: 0.75; text-align: right; white-space: nowrap; color: var(--navy); }

  /* ---------- Week bingo slide ---------- */
  .bingo-week { width: 100%; max-width: 1200px; text-align: left; margin-top: 24px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; }
  .bingo-day { background: rgba(255,255,255,0.12); border-radius: 14px; padding: 14px 14px; }
  .bingo-day h4 {
    font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; opacity: 0.95; text-align: center;
  }
  .bingo-day ul { list-style: none; margin: 0; padding: 0; }
  .bingo-day li { font-size: 11.5px; line-height: 1.4; padding: 3px 0 3px 12px; position: relative; }
  .bingo-day li::before { content: "•"; position: absolute; left: 0; opacity: 0.7; }

  /* ---------- Sponsor placeholder ---------- */
  .sponsor-card {
    background: var(--white); border: 2px dashed rgba(49,46,97,0.25); border-radius: 18px;
    padding: 48px 56px; max-width: 820px;
  }
  .sponsor-card .tag {
    display: inline-block; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 12px;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--pink-dark); background: rgba(216,90,149,0.1);
    padding: 6px 14px; border-radius: 999px; margin-bottom: 18px;
  }
  .sponsor-card p { color: var(--navy); font-size: 17px; line-height: 1.6; margin: 0; }

  .bingo-how { margin-top: 20px; font-size: 14px; opacity: 0.85; max-width: 700px; text-align: center; }

  /* ---------- Nav controls ---------- */
  .nav-btn {
    position: fixed; top: 50%; transform: translateY(-50%); width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,0.12); border: none; color: #fff; font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background 0.15s ease; z-index: 10;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.25); }
  .nav-prev { left: 18px; } .nav-next { right: 18px; }
  body:has(.slide.active.theme-light) .nav-btn,
  body:has(.slide.active.theme-skyblue) .nav-btn { color: var(--navy); background: rgba(49,46,97,0.08); }
  body:has(.slide.active.theme-light) .nav-btn:hover,
  body:has(.slide.active.theme-skyblue) .nav-btn:hover { background: rgba(49,46,97,0.16); }

  .dots { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; transition: background 0.15s ease, transform 0.15s ease; }
  .dot.active { background: #fff; transform: scale(1.3); }
  body:has(.slide.active.theme-light) .dot,
  body:has(.slide.active.theme-skyblue) .dot { background: rgba(49,46,97,0.22); }
  body:has(.slide.active.theme-light) .dot.active,
  body:has(.slide.active.theme-skyblue) .dot.active { background: var(--navy); }

  .counter {
    position: fixed; top: 18px; right: 24px; font-family: 'Montserrat', sans-serif; font-weight: 700;
    font-size: 13px; color: rgba(255,255,255,0.6); z-index: 10;
  }
  body:has(.slide.active.theme-light) .counter,
  body:has(.slide.active.theme-skyblue) .counter { color: rgba(49,46,97,0.45); }
</style>
</head>
<body>

<div class="deck" id="deck"></div>

<button class="nav-btn nav-prev" id="btnPrev" aria-label="Previous slide">‹</button>
<button class="nav-btn nav-next" id="btnNext" aria-label="Next slide">›</button>
<div class="dots" id="dots"></div>
<div class="counter" id="counter"></div>

<script>
(function () {
  var LOGO_URL = "https://pagebuildersummit.com/wp-content/uploads/2021/03/cropped-Asset-1.png";

  /* =========================================================
     WEEK — everything specific to this call lives here.
     PBS 9.0 runs ONE kickoff call for the whole week (not daily like 8.0),
     so this covers all five days at once rather than a single day.
  ========================================================= */
  var SCHEDULE_URL = "pagebuildersummit.com/schedule-2026";

  var LIVE_HIGHLIGHTS = [
    { what: "LIVE: Kinsey Soderberg — Client Onboarding Hub Build", when: "Mon 2 Nov, 11:00 PM UK" },
    { what: "LIVE Q&A: Haley Brown & Sarah Linklater — The Invisible Work", when: "Wed 4 Nov, 12:00 AM UK" },
    { what: "LIVE: Amber Hinds — The Fastest Way to Make Your Website Accessible", when: "Wed 4 Nov, 3:00 PM UK" }
  ];

  var WEEK = [
    {
      label: "Monday", date: "2 November",
      sessions: [
        { title: "Build Bold Website Features With AI—On the Platforms You Already Use", who: "Rache De Luna" },
        { title: "Maintenance Plans Making Big Money (In 2026)", who: "Josh Hall" },
        { title: "Pixel-Perfect Prompting: Vocabulary and Techniques to Make Your Agent a Better Designer", who: "Robby McCullough" },
        { title: "Everyday AI Habits for Web Designers", who: "Cami MacNamara" },
        { title: "Live Build: A Client Onboarding Hub in One Session With Claude", who: "Kinsey Soderberg" }
      ],
      bingo: [
        "60-Minute Marketing Strategy Call with Shannon Mattern ($500 value)",
        "The Course Hub Build Kit — Kinsey Soderberg ($597)",
        "$20 Amazon Gift Card"
      ]
    },
    {
      label: "Tuesday", date: "3 November",
      sessions: [
        { title: "85% of the Sites We Build Don't Need WordPress Anymore", who: "Kevin Geary" },
        { title: "AI Words (Kinda) Matter", who: "Michelle Bourbonniere, PhD" },
        { title: "Don't Replace Your Team With AI. Use AI to Finally Build One.", who: "Eric Dingler" },
        { title: "How to Deliver Premium $5k-$10k Websites in Five Focused Days", who: "Whitney Zimmermann" },
        { title: "From Web Designer to Creative Director", who: "Alexia Lynn" },
        { title: "Watch Me Teach AI My SEO Strategy Video Process", who: "Sam Sarsten" }
      ],
      bingo: [
        "Hire to Grow by Eric Dingler, winner's choice of format ($9.99)",
        "The One Week Website Starter Pack — Whitney Zimmermann ($297)",
        "BTS My ClickUp System & Web Design Workflow — Alexia Lynn ($97)"
      ]
    },
    {
      label: "Wednesday", date: "4 November",
      sessions: [
        { title: "Live Q&A: The Invisible Work — Managing the Mental Load of Business and Life", who: "Haley Brown & Sarah Linklater" },
        { title: "Same Standards, Any Builder: How I Get AI to Build Real WordPress and HighLevel Sites", who: "Chantal Edouard-Betsy" },
        { title: "How Etch Can Make Offering Both WordPress and Non WordPress Solutions Easy", who: "Endre Solem" },
        { title: "The Gift That Keeps on Giving: How an Online Advent Calendar Builds Your List", who: "Britta Just" },
        { title: "Rethinking WordPress Maintenance: A Better Way to Run Content-Focused Sites", who: "Patrick Posner" },
        { title: "$12,872/Month Recurring Revenue From Our Small YouTube Channel", who: "Mike Killen" },
        { title: "The Fastest Way to Make Your Website Accessible", who: "Amber Hinds" },
        { title: "AI Changed Everything. Here's Why Content-First Still Matters", who: "Jakson" },
        { title: "How I Manage Client Projects Without Losing My Mind", who: "Katelyn Dekle" },
        { title: "The One Offer Rule: 7 Ways to Deliver Premium Design Work", who: "Sarah Masci" },
        { title: "Marketing and Getting Clients: What's Working Now", who: "Shannon Mattern" },
        { title: "Inside My Notion HQ: The Mixtape Behind My Whole Business", who: "Lisa Williams" },
        { title: "The Three AI Workflows That Supercharge Human Web Designers", who: "Tim Strifler" }
      ],
      bingo: [
        "Private 1-Hour Call with Sam Sarsten ($250)",
        "Rose Sales Page Template — Chantal Edouard-Betsy ($147)",
        "$20 Amazon Gift Card"
      ]
    },
    {
      label: "Thursday", date: "5 November",
      sessions: [
        { title: "When the Copy Isn't Ready: How to Keep Bad Copy From Derailing Your Website Project", who: "Nicole Kepic" },
        { title: "Pretty Doesn't Sell on Shopify: What's Converting and How We're Building With AI", who: "Chloe & Hana" },
        { title: "AI Is AIR for Creators", who: "Maestro Stevens" },
        { title: "Connecting AI Agents to WordPress: What MCP Unlocks for Page Builders", who: "Dyllon Boynton" },
        { title: "Accessibility Gems Hidden Inside GenerateBlocks for WordPress", who: "Alicia St Rose" },
        { title: "Build Once, Run Forever: Automations Every Web Pro Can Steal", who: "Anchen le Roux" }
      ],
      bingo: [
        "1:1 Online Advent Calendar Strategy Session — Britta Just (180 €)",
        "Signed copies of Sell Futures, Not Features and Five Figure Funnels — Mike Killen",
        "$20 Amazon Gift Card"
      ]
    },
    {
      label: "Friday", date: "6 November",
      sessions: [
        { title: "Why True Drag and Drop Can Save WordPress", who: "Melissa Love" }
      ],
      bingo: [
        "1-Hour WordPress Consultancy with Jakson ($95)",
        "30-Minute Live Call with Dyllon Boynton: Build and Fix Pages with AI ($150)",
        "Build It With Me: 1:1 Automation Session — Anchen ($397)"
      ]
    }
  ];

  /* =========================================================
     SLIDE BUILDERS
  ========================================================= */
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function titleSlide(theme, eyebrow, titleHtml, subHtml) {
    var s = el("div", "slide " + theme);
    var wrap = el("div", "logo-row");
    var img = document.createElement("img");
    img.src = LOGO_URL; img.alt = "Page Builder Summit";
    if (theme === "theme-light") img.style.filter = "none";
    wrap.appendChild(img);
    s.appendChild(wrap);
    if (eyebrow) s.appendChild(el("div", "eyebrow", eyebrow));
    s.appendChild(el("h1", null, titleHtml));
    if (subHtml) s.appendChild(el("div", "sub", subHtml));
    return s;
  }

  function urlSlide(theme, eyebrow, titleHtml, url) {
    var s = el("div", "slide " + theme);
    if (eyebrow) s.appendChild(el("div", "eyebrow", eyebrow));
    s.appendChild(el("h1", null, titleHtml));
    s.appendChild(el("div", "big-url", url));
    return s;
  }

  function liveHighlightsSlide() {
    var s = el("div", "slide theme-skyblue");
    s.appendChild(el("h1", null, "Where do I find the LIVE sessions<br>in the Facebook Group?"));
    s.appendChild(el("div", "big-url", SCHEDULE_URL));
    var box = el("div", "live-box");
    box.appendChild(el("h3", null, "3 sessions run fully live this week"));
    LIVE_HIGHLIGHTS.forEach(function (item) {
      var row = el("div", "live-item");
      row.appendChild(el("div", "what", item.what));
      row.appendChild(el("div", "when", item.when));
      box.appendChild(row);
    });
    s.appendChild(box);
    return s;
  }

  function daySlide(day) {
    var s = el("div", "slide theme-light");
    var wrap = el("div", "sched-wrap");
    wrap.appendChild(el("div", "eyebrow sched-head", "This Week's Schedule"));
    wrap.appendChild(el("h2", null, day.label + " " + day.date));

    var list = el("ul", "sched-list" + (day.sessions.length > 7 ? " dense" : ""));
    day.sessions.forEach(function (item) {
      var li = document.createElement("li");
      li.innerHTML = "<strong>" + item.title + "</strong><br><span class=\"who\">" + item.who + "</span>";
      list.appendChild(li);
    });
    wrap.appendChild(list);
    wrap.appendChild(el("div", "sched-count", day.sessions.length + " session" + (day.sessions.length === 1 ? "" : "s") + " — exact times and links on the schedule page"));

    s.appendChild(wrap);
    return s;
  }

  function sponsorPlaceholderSlide() {
    var s = el("div", "slide theme-light");
    var card = el("div", "sponsor-card");
    card.appendChild(el("div", "tag", "Content needed"));
    card.appendChild(el("h2", null, "Sponsor slide(s) go here"));
    card.appendChild(el("p", null,
      "No PBS 9.0 sponsor list was available when this deck was built. " +
      "Replace this slide (and add one per sponsor/tier, same as the old deck's " +
      "Partner / Patron / Micro sections) once the sponsor details are confirmed."));
    s.appendChild(card);
    return s;
  }

  function weekBingoSlide(week) {
    var s = el("div", "slide theme-pink");
    s.appendChild(el("div", "eyebrow", "This week's giveaway"));
    s.appendChild(el("h2", null, "Bingo Prizes All Week &amp; How to Play"));
    var wrap = el("div", "bingo-week");
    week.forEach(function (day) {
      var dayBlock = el("div", "bingo-day");
      dayBlock.appendChild(el("h4", null, day.label));
      var list = el("ul");
      day.bingo.forEach(function (p) { list.appendChild(el("li", null, p)); });
      dayBlock.appendChild(list);
      wrap.appendChild(dayBlock);
    });
    s.appendChild(wrap);
    s.appendChild(el("div", "bingo-how",
      "Tap a square the moment you earn it. Get a bingo (or the full card!) and post a screenshot in the Facebook group under that day's bingo post to be entered in that day's prize draw."));
    return s;
  }

  /* =========================================================
     BUILD DECK
  ========================================================= */
  var deck = document.getElementById("deck");
  var slides = [
    titleSlide("theme-skyblue", "Page Builder Summit 9.0", "Welcome to the<br>Kickoff Call<br><em style=\"color:var(--pink); font-style:normal;\">What's Working Now</em>", "Monday 2 November · Let's go! 🎉"),
    urlSlide("theme-teal", null, "Where do I find the links?", SCHEDULE_URL),
    liveHighlightsSlide()
  ];
  WEEK.forEach(function (day) { slides.push(daySlide(day)); });
  slides.push(
    titleSlide("theme-skyblue", null, "Massive Thanks To Our Speakers", "What a line-up! A whole heap of talented people for you to enjoy this week..."),
    titleSlide("theme-pink", null, "Page Builder Summit 9.0 Is Proudly<br>Sponsored By The Following<br>Amazing Companies...", null),
    sponsorPlaceholderSlide(),
    weekBingoSlide(WEEK),
    urlSlide("theme-skyblue", "Remember, if you get stuck…", "Everything lives at", SCHEDULE_URL),
    titleSlide("theme-pink", null, "Have a great week! 💛", null)
  );

  slides.forEach(function (s, i) { s.dataset.index = i; deck.appendChild(s); });

  var dotsWrap = document.getElementById("dots");
  slides.forEach(function (_, i) {
    var d = el("div", "dot");
    d.addEventListener("click", function () { goTo(i); });
    dotsWrap.appendChild(d);
  });

  var current = 0;
  function render() {
    slides.forEach(function (s, i) { s.classList.toggle("active", i === current); });
    Array.prototype.forEach.call(dotsWrap.children, function (d, i) {
      d.classList.toggle("active", i === current);
    });
    document.getElementById("counter").textContent = (current + 1) + " / " + slides.length;
  }
  function goTo(i) { current = Math.max(0, Math.min(slides.length - 1, i)); render(); }
  function next() { goTo(current + 1); }
  function prev() { goTo(current - 1); }

  document.getElementById("btnNext").addEventListener("click", next);
  document.getElementById("btnPrev").addEventListener("click", prev);
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { next(); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { prev(); e.preventDefault(); }
    else if (e.key.toLowerCase() === "f") {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
  });

  render();
})();
</script>
</body>
</html>

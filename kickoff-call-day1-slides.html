<title>Page Builder Summit 9.0 — Kickoff Call Slides</title>
<!--
  PBS 9.0 — Kickoff call slide deck (ONE call for the whole week, not daily)
  ===========================================================================
  Built to match the attendee hub / schedule page branding (same colors,
  fonts, components) rather than the old PBS 8.0 deck's design — but the
  CONTENT FLOW follows that old deck closely: welcome -> where to find
  links -> where to find live sessions -> the week's schedule -> speaker
  thanks -> sponsors (tiered) -> the week's bingo prizes -> reminder ->
  sign-off. The slide ORDER now follows Anchen's "Kickoff call LIVE Agenda -
  PBS 9.0" outline (welcome, what's changed, how sessions work, networking,
  attendee hub, PowerPack, partners/featured speaker, bingo, thanks, Q&A).

  PBS 9.0 runs this as a SINGLE kickoff call (no daily calls like 8.0 had),
  so the schedule and bingo sections cover the whole week at once rather
  than "today's" content. All of that content lives in the WEEK array near
  the top of the script (search "WEEK =") if it ever needs updating.
  Partners: show.fm (logo + blurb) and Simply Digital Shops (logo only), then the
  featured speaker slide (Squarestylist / Rache De Luna).

  NAVIGATION: arrow keys / click the left-right edges / on-screen buttons /
  dot indicators at the bottom. Press "F" for fullscreen (handy when
  screen-sharing on the call). Built for 16:9 presentation, not a public
  page — not intended for mobile/responsive polish.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #D85A95;
    --pink-dark: #CC4E89;
    --blue: #25AAE1;
    --blue-dark: #199ED5;
    --navy: #312E61;
    --teal: #75B8A1;
    --teal-dark: #5FA088;
    --white: #ffffff;
    --off-white: #FBFCFE;
    --light-blue: #E2F0FB;
    --text-light: rgba(255,255,255,0.85);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: 'Open Sans', sans-serif; background: var(--navy);
  }
  h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; margin: 0; }

  /* ---------- Deck shell ---------- */
  .deck { position: relative; width: 100%; height: 100vh; }
  .slide {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 6vh 8vw;
  }
  .slide.active { display: flex; }

  /* Slide background themes — no dark navy backgrounds */
  .theme-skyblue { background: var(--light-blue); color: var(--navy); }
  .theme-pink   { background: linear-gradient(135deg, var(--pink) 0%, var(--pink-dark) 100%); color: #fff; }
  .theme-light  { background: var(--off-white); color: var(--navy); }
  .theme-teal   { background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%); color: #fff; }

  .eyebrow {
    font-family: 'Montserrat', sans-serif; font-size: clamp(13px, 1.4vw, 16px); font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase; opacity: 0.85; margin-bottom: 18px;
  }
  .theme-light .eyebrow, .theme-skyblue .eyebrow { color: var(--pink-dark); }

  .slide h1 { font-size: clamp(34px, 5.5vw, 76px); font-weight: 900; line-height: 1.08; }
  .slide h2 { font-size: clamp(26px, 3.6vw, 48px); font-weight: 800; line-height: 1.15; }
  .slide .sub { font-size: clamp(16px, 1.8vw, 24px); font-weight: 500; margin-top: 18px; opacity: 0.92; max-width: 900px; }
  .slide .big-url {
    font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: clamp(22px, 3.2vw, 42px);
    margin-top: 28px; padding: 14px 32px; border-radius: 999px; background: rgba(255,255,255,0.14);
    letter-spacing: 0.5px; word-break: break-word;
  }
  .theme-light .big-url, .theme-skyblue .big-url { background: rgba(49,46,97,0.08); color: var(--navy); }

  .logo-row img { height: 52px; margin-bottom: 28px; }

  /* ---------- Schedule slides (one per day) ---------- */
  .sched-wrap { width: 100%; max-width: 1150px; text-align: left; }
  .sched-head { text-align: center; margin-bottom: 4px; }
  .sched-date { text-align: center; font-size: clamp(14px, 1.3vw, 17px); opacity: 0.85; margin-bottom: 26px; }
  .sched-list { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 36px; }
  .sched-list.dense { columns: 2; font-size: 0.92em; }
  .sched-list li {
    break-inside: avoid; font-size: clamp(13px, 1.15vw, 17px); line-height: 1.45; margin-bottom: 11px; padding-left: 18px; position: relative;
  }
  .sched-list li::before { content: "▸"; position: absolute; left: 0; color: var(--pink); font-weight: 800; }
  .sched-list strong { color: var(--navy); font-family: 'Montserrat', sans-serif; font-weight: 700; }
  .sched-list .who { color: var(--pink-dark); font-weight: 600; }
  .sched-count { text-align: center; font-size: 13px; opacity: 0.6; margin-top: 18px; }

  /* ---------- Live highlights (on the "where to find live" slide) ---------- */
  .live-box {
    background: rgba(255,255,255,0.6); border-radius: 16px; padding: 20px 28px; margin-top: 24px; max-width: 1050px; text-align: left;
  }
  .live-box h3 {
    font-size: clamp(14px, 1.3vw, 17px); font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    color: var(--pink-dark); margin-bottom: 12px; text-align: center;
  }
  .live-item { display: flex; justify-content: space-between; gap: 20px; align-items: baseline; padding: 14px 0; border-top: 1px solid rgba(49,46,97,0.12); }
  .live-item:first-of-type { border-top: none; }
  .live-item .what { font-size: clamp(18px, 1.9vw, 26px); font-weight: 600; color: var(--navy); }
  .live-item .when { font-size: clamp(14px, 1.5vw, 20px); opacity: 0.75; text-align: right; white-space: nowrap; color: var(--navy); }

  /* ---------- Large-format list slides ---------- */
  .big-list { list-style: none; margin: 26px 0 0; padding: 0; max-width: 1050px; text-align: left; counter-reset: n; }
  .big-list li { font-size: clamp(20px, 2.5vw, 36px); font-weight: 600; line-height: 1.3; padding: 11px 0 11px 56px; position: relative; }
  .big-list li::before { content: "\2713"; position: absolute; left: 0; top: 11px; font-weight: 900; color: var(--pink); }
  .big-list.numbered li::before {
    counter-increment: n; content: counter(n); width: 38px; height: 38px; border-radius: 50%; top: 14px;
    background: var(--pink); color: #fff; font-size: 0.7em; display: flex; align-items: center; justify-content: center;
  }
  .theme-pink .big-list li::before, .theme-teal .big-list li::before { color: #fff; }
  .theme-pink .big-list.numbered li::before { background: #fff; color: var(--pink-dark); }
  .big-list li small { display: block; font-size: 0.6em; font-weight: 500; opacity: 0.8; margin-top: 2px; }
  .big-list.prizes li { font-size: clamp(24px, 3.2vw, 46px); font-weight: 700; padding: 16px 0 16px 64px; line-height: 1.25; border-top: 1px solid rgba(255,255,255,0.28); }
  .big-list.prizes li:first-child { border-top: none; }
  .big-list.prizes li::before { content: "\2605"; top: 16px; }
  .slide .note { font-size: clamp(16px, 1.7vw, 24px); font-weight: 600; margin-top: 22px; opacity: 0.9; }

  /* ---------- Link cards ---------- */
  .card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; width: 100%; max-width: 1100px; margin-top: 28px; text-align: left; }
  .card { background: var(--white); border: 2px solid rgba(117,184,161,0.45); border-radius: 16px; padding: 22px 28px; color: var(--navy); }
  .card h3 { font-size: clamp(20px, 2vw, 30px); font-weight: 800; }
  .card p { font-size: clamp(15px, 1.4vw, 20px); margin: 6px 0 0; line-height: 1.4; }
  .card .url { color: var(--blue-dark); font-weight: 800; }

  /* ---------- Networking slide ---------- */
  .net-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; width: 100%; max-width: 1180px; margin-top: 24px; text-align: left; }
  .net-col { background: var(--white); border-radius: 16px; padding: 20px 26px 12px; color: var(--navy); }
  .net-col h3 { font-size: clamp(16px, 1.6vw, 22px); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--pink-dark); margin-bottom: 8px; }
  .net-row { padding: 12px 0; border-top: 1px solid rgba(49,46,97,0.12); }
  .net-row:first-of-type { border-top: none; }
  .net-row .what { font-size: clamp(17px, 1.7vw, 24px); font-weight: 700; }
  .net-row .when { font-size: clamp(14px, 1.4vw, 20px); opacity: 0.85; margin-top: 2px; }

  /* ---------- Labelled URLs ---------- */
  .url-block { margin-top: 24px; }
  .url-block .lab { font-size: clamp(14px, 1.5vw, 20px); font-weight: 700; opacity: 0.8; margin-bottom: 2px; }
  .url-block .big-url { margin-top: 6px; }

  /* ---------- Partner slide ---------- */
  .sponsor-card {
    background: var(--white); border: 2px solid rgba(117,184,161,0.5); border-radius: 18px;
    padding: 36px 56px 40px; max-width: 860px; text-align: center;
  }
  .sponsor-card .tag {
    display: inline-block; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 13px;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--teal); margin-bottom: 8px;
  }
  /* The logo PNG has a lot of transparent padding: cover-crop it to the middle band. */
  .sponsor-logo { width: 480px; max-width: 100%; height: 190px; margin: 0 auto 14px; overflow: hidden; }
  .sponsor-logo img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .sponsor-logo.fit { height: auto; max-height: 190px; display: flex; align-items: center; justify-content: center; }
  .sponsor-logo.fit img { width: auto; height: auto; max-width: 100%; max-height: 190px; object-fit: contain; }
  .sponsor-card.featured { max-width: 960px; padding: 30px 56px 34px; }
  .sponsor-card.featured .sponsor-logo.fit, .sponsor-card.featured .sponsor-logo.fit img { max-height: 110px; }
  .sponsor-card.featured p.small { font-size: 17px; line-height: 1.5; }
  .sponsor-card.logo-only { padding: 40px 72px 44px; }
  .sponsor-card h2 { color: var(--navy); font-size: 30px; margin: 4px 0 6px; }
  .sponsor-card .session { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 20px; line-height: 1.35; color: var(--pink-dark); margin: 0 0 6px; }
  .sponsor-card .when { font-size: 16px; opacity: 0.8; margin: 0 0 14px; }
  .sponsor-card p.small { font-size: 18px; }
  .sponsor-card p { color: var(--navy); font-size: 21px; line-height: 1.55; margin: 0 0 14px; }
  .sponsor-card p:last-child { margin-bottom: 0; }
  .sponsor-card a { color: var(--blue); font-weight: 700; text-decoration: none; }

  /* ---------- Nav controls ---------- */
  .nav-btn {
    position: fixed; top: 50%; transform: translateY(-50%); width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,0.12); border: none; color: #fff; font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background 0.15s ease; z-index: 10;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.25); }
  .nav-prev { left: 18px; } .nav-next { right: 18px; }
  body:has(.slide.active.theme-light) .nav-btn,
  body:has(.slide.active.theme-skyblue) .nav-btn { color: var(--navy); background: rgba(49,46,97,0.08); }
  body:has(.slide.active.theme-light) .nav-btn:hover,
  body:has(.slide.active.theme-skyblue) .nav-btn:hover { background: rgba(49,46,97,0.16); }

  .dots { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; transition: background 0.15s ease, transform 0.15s ease; }
  .dot.active { background: #fff; transform: scale(1.3); }
  body:has(.slide.active.theme-light) .dot,
  body:has(.slide.active.theme-skyblue) .dot { background: rgba(49,46,97,0.22); }
  body:has(.slide.active.theme-light) .dot.active,
  body:has(.slide.active.theme-skyblue) .dot.active { background: var(--navy); }

  .counter {
    position: fixed; top: 18px; right: 24px; font-family: 'Montserrat', sans-serif; font-weight: 700;
    font-size: 13px; color: rgba(255,255,255,0.6); z-index: 10;
  }
  body:has(.slide.active.theme-light) .counter,
  body:has(.slide.active.theme-skyblue) .counter { color: rgba(49,46,97,0.45); }
</style>
</head>
<body>

<div class="deck" id="deck"></div>

<button class="nav-btn nav-prev" id="btnPrev" aria-label="Previous slide">‹</button>
<button class="nav-btn nav-next" id="btnNext" aria-label="Next slide">›</button>
<div class="dots" id="dots"></div>
<div class="counter" id="counter"></div>

<script>

  /* =========================================================
     SLIDE BUILDERS
  ========================================================= */
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function titleSlide(theme, eyebrow, titleHtml, subHtml) {
    var s = el("div", "slide " + theme);
    var wrap = el("div", "logo-row");
    var img = document.createElement("img");
    img.src = LOGO_URL; img.alt = "Page Builder Summit";
    if (theme === "theme-light") img.style.filter = "none";
    wrap.appendChild(img);
    s.appendChild(wrap);
    if (eyebrow) s.appendChild(el("div", "eyebrow", eyebrow));
    s.appendChild(el("h1", null, titleHtml));
    if (subHtml) s.appendChild(el("div", "sub", subHtml));
    return s;
  }

  function urlSlide(theme, eyebrow, titleHtml, url) {
    var s = el("div", "slide " + theme);
    if (eyebrow) s.appendChild(el("div", "eyebrow", eyebrow));
    s.appendChild(el("h1", null, titleHtml));
    s.appendChild(el("div", "big-url", url));
    return s;
  }

  function liveHighlightsSlide() {
    var s = el("div", "slide theme-skyblue");
    s.appendChild(el("h1", null, "Where do I find the LIVE sessions?"));
    s.appendChild(el("div", "sub", "Right on the presentation page, the same place you watch everything else. Find the links on the schedule page or in your Attendee Hub."));
    var box = el("div", "live-box");
    box.appendChild(el("h3", null, "3 sessions run fully live this week"));
    LIVE_HIGHLIGHTS.forEach(function (item) {
      var row = el("div", "live-item");
      row.appendChild(el("div", "what", item.what));
      row.appendChild(el("div", "when", item.when));
      box.appendChild(row);
    });
    s.appendChild(box);
    return s;
  }

  function daySlide(day) {
    var s = el("div", "slide theme-light");
    var wrap = el("div", "sched-wrap");
    wrap.appendChild(el("div", "eyebrow sched-head", "This Week's Schedule"));
    wrap.appendChild(el("h2", null, day.label + " " + day.date));

    if (day.networkingOnly) {
      wrap.style.textAlign = "center";
      var note = el("div", "sub", "No presentations today — just networking.<br>VIP co-working, VIP + attendee networking, and the closing call.");
      note.style.margin = "18px auto 0";
      note.style.color = "var(--navy)";
      wrap.appendChild(note);
      s.appendChild(wrap);
      return s;
    }

    var list = el("ul", "sched-list" + (day.sessions.length > 7 ? " dense" : ""));
    day.sessions.forEach(function (item) {
      var li = document.createElement("li");
      li.innerHTML = "<strong>" + item.title + "</strong><br><span class=\"who\">" + item.who + "</span>";
      list.appendChild(li);
    });
    wrap.appendChild(list);
    wrap.appendChild(el("div", "sched-count", day.sessions.length + " session" + (day.sessions.length === 1 ? "" : "s") + " — exact times and links on the schedule page"));

    s.appendChild(wrap);
    return s;
  }

  function partnerSlide() {
    var s = el("div", "slide theme-light");
    var card = el("div", "sponsor-card");
    card.appendChild(el("div", "tag", "Proudly supported by our partner"));
    var logo = el("div", "sponsor-logo");
    var img = document.createElement("img");
    img.src = "https://i0.wp.com/pagebuildersummit.com/wp-content/uploads/2026/10/show.fm-podcasting-made-easier.png?w=1000&quality=80&ssl=1";

    logo.appendChild(img);
    card.appendChild(logo);
    card.appendChild(el("p", null,
      "<strong>show.fm</strong> is a brand new way to make podcasts. All the tools you need to succeed, one account. " +
      "Book guests, produce the episodes, automate the dull things, publish everywhere, and measure your show\u2019s success from one place. " +
      "Now you can spend your time on the conversation."));

  function simplyDigitalShopsSlide() {
    var s = el("div", "slide theme-light");
    var card = el("div", "sponsor-card logo-only");
    card.appendChild(el("div", "tag", "Proudly supported by our partner"));
    var logo = el("div", "sponsor-logo fit");
    var img = document.createElement("img");
    img.src = "https://pagebuildersummit.com/wp-content/uploads/2026/10/Simply-Digital-Shops-Logo.png";
    img.alt = "Simply Digital Shops";
    logo.appendChild(img);
    card.appendChild(logo);
    s.appendChild(card);
    return s;
  }

  // Rache's bio (left out of the slide if this is ever emptied).
  var FEATURED_BIO = "Rache De Luna is a self-taught web designer and developer and the founder of Squarestylist. From starting with zero coding knowledge to selling over a thousand website templates and building hundreds of websites, she now mentors hundreds of designers through her signature programs, Standout Squarespace, Standout Shopify and Design Forward. Her mission is to help designers master technical skills, create sought-after websites, and build thriving businesses.";

  function featuredSpeakerSlide() {
    var s = el("div", "slide theme-light");
    var card = el("div", "sponsor-card featured");
    card.appendChild(el("div", "tag", "Featured speaker"));
    var logo = el("div", "sponsor-logo fit");
    logo.style.marginBottom = "10px";
    var img = document.createElement("img");
    img.src = "https://pagebuildersummit.com/wp-content/uploads/2026/10/squarestylist-logo.png";
    img.alt = "Squarestylist";
    logo.appendChild(img);
    card.appendChild(logo);
    card.appendChild(el("h2", null, "Rache De Luna"));
    if (FEATURED_BIO) card.appendChild(el("p", "small", FEATURED_BIO));
    card.appendChild(el("div", "session", "Build bold website features with AI using the platforms you already use"));
    card.appendChild(el("div", "when", "Today &middot; 11 AM PT / 2 PM ET / 7 PM UK"));
    card.appendChild(el("p", "small", "Find out more at <a href=\"https://www.squarestylist.com/pbinvite\">squarestylist.com/pbinvite</a>"));
    s.appendChild(card);
    return s;
  }

  // items: plain HTML strings; use "<b>Heading</b><small>detail</small>" for a heading + detail line
  function listSlide(theme, eyebrow, titleHtml, items, opts) {
    opts = opts || {};
    var s = el("div", "slide " + theme);
    if (eyebrow) s.appendChild(el("div", "eyebrow", eyebrow));
    s.appendChild(el("h2", null, titleHtml));
    var ul = el("ul", "big-list" + (opts.numbered ? " numbered" : "") + (opts.prizes ? " prizes" : ""));
    items.forEach(function (t) { ul.appendChild(el("li", null, t)); });
    s.appendChild(ul);
    if (opts.note) s.appendChild(el("div", "note", opts.note));
    return s;
  }

  function cardsSlide(theme, titleHtml, cards) {
    var s = el("div", "slide " + theme);
    s.appendChild(el("h2", null, titleHtml));
    var grid = el("div", "card-grid");
    cards.forEach(function (c) {
      var card = el("div", "card");
      card.appendChild(el("h3", null, c.h));
      if (c.p) card.appendChild(el("p", null, c.p));
      if (c.url) card.appendChild(el("p", "url", c.url));
      grid.appendChild(card);
    });
    s.appendChild(grid);
    return s;
  }

  function networkingSlide() {
    var s = el("div", "slide theme-skyblue");
    s.appendChild(el("div", "eyebrow", "Page Builder PowerPack"));
    s.appendChild(el("h2", null, "Networking &amp; co-working sessions"));
    function col(title, rows) {
      var c = el("div", "net-col");
      c.appendChild(el("h3", null, title));
      rows.forEach(function (r) {
        var row = el("div", "net-row");
        row.appendChild(el("div", "what", r[0]));
        row.appendChild(el("div", "when", r[1]));
        c.appendChild(row);
      });
      return c;
    }
    var grid = el("div", "net-grid");
    grid.appendChild(col("Monday – Thursday", [
      ["VIP Networking 1", "Mon 4 PM PT · 7 PM ET · Tue 12 AM UK"],
      ["VIP Networking 2", "Wed 1 AM PT · 4 AM ET · 9 AM UK"],
      ["VIP Networking 3 (hosted by Britta)", "Wed 8 AM PT · 11 AM ET · 4 PM UK"],
      ["VIP Networking 4", "Thu 11 AM PT · 2 PM ET · 7 PM UK"]
    ]));
    grid.appendChild(col("Friday", [
      ["VIP Co-Working 1", "Fri 11 AM PT · 2 PM ET · 7 PM UK"],
      ["VIP Co-Working 2", "Fri 12 PM PT · 3 PM ET · 8 PM UK"],
      ["VIP + Attendee Networking", "Fri 1 PM PT · 4 PM ET · 9 PM UK"],
      ["Closing Call", "Fri 3 PM PT · 6 PM ET · 11 PM UK"]
    ]));
    s.appendChild(grid);
    s.appendChild(el("div", "note", "Join links are inside the Page Builder PowerPack"));
    return s;
  }

  function hubSlide() {
    var s = el("div", "slide theme-pink");
    s.appendChild(el("div", "eyebrow", "How to avoid getting overwhelmed"));
    s.appendChild(el("h1", null, "Build your personal<br>summit plan"));
    s.appendChild(el("div", "sub", "Answer a few quick questions and get sessions picked for you, in your own time zone, with one-click calendar invites. It's your personalised schedule."));
    s.appendChild(el("div", "big-url", HUB_URL));
    return s;
  }

  function priceSlide() {
    var s = el("div", "slide theme-pink");
    s.appendChild(el("div", "eyebrow", "Last chance for the early-bird price"));
    s.appendChild(el("h1", null, "$97"));
    s.appendChild(el("div", "sub", "then $147 once the first session goes live<br><strong>11 AM PT · 2 PM ET · 7 PM UK</strong> today"));
    var u = el("div", "big-url", POWERPACK_URL);
    u.style.fontSize = "clamp(16px, 2.2vw, 30px)";
    s.appendChild(u);
    s.appendChild(el("div", "note", "See every bonus the speakers have contributed"));
    return s;
  }

  function bingoHowSlide() {
    return listSlide("theme-pink", "Prizes all week", "How bingo works", [
      "Open your interactive bingo card at <strong>" + BINGO_URL + "</strong>",
      "Tap a square the moment you earn it",
      "Get a bingo (or the full card!) and post a screenshot in that day's bingo thread in the Facebook group",
      "You have at least 24 hours to post, and you can only win once",
      "PowerPack owners get more opportunities"
    ], { numbered: true });
  }

  function bingoDaySlide(day) {
    return listSlide("theme-pink", "Bingo prizes", day.label + "'s prizes", day.bingo, { prizes: true });
  }

  function twoUrlSlide(theme, eyebrow, titleHtml, blocks) {
    var s = el("div", "slide " + theme);
    if (eyebrow) s.appendChild(el("div", "eyebrow", eyebrow));
    s.appendChild(el("h2", null, titleHtml));
    blocks.forEach(function (b) {
      var blk = el("div", "url-block");
      blk.appendChild(el("div", "lab", b.label));
      blk.appendChild(el("div", "big-url", b.url));
      s.appendChild(blk);
    });
    return s;
  }

  /* =========================================================
     BUILD DECK
  ========================================================= */
  var deck = document.getElementById("deck");
  var slides = [
    // Welcome / intro from Anchen
    titleSlide("theme-skyblue", "Page Builder Summit 9.0", "Welcome to the<br>Kickoff Call<br><em style=\"color:var(--pink); font-style:normal;\">What's Working Now</em>", "Monday 2 November · Let's go! 🎉"),
    titleSlide("theme-light", null, "Hi, I'm Anchen 👋", "Your host for Page Builder Summit 9.0"),
    // Why we launched the summit + what's changed
    listSlide("theme-skyblue", "Why we launched the summit… and what's changed", "What's new this year", [
      "<b>Your personal summit plan</b><small>The Attendee Hub builds your own schedule</small>",
      "<b>Live Q&amp;A with the speakers</b><small>On most presentations, 45 minutes after release, on the same page</small>",
      "<b>A few fully live sessions</b>",
      "<b>Every presentation has its own release time</b>",
      "<b>Networking &amp; co-working sessions</b><small>All week, for PowerPack owners</small>"
    ]),
    // Thanks to
    titleSlide("theme-teal", null, "A big thank you to<br>Sunita &amp; Britta", null),
    // How the sessions work
    cardsSlide("theme-skyblue", "Where do I find the links?", [
      { h: "📧 Your daily email", p: "Each morning: that day's lineup and links" },
      { h: "📅 The schedule page", url: SCHEDULE_URL },
      { h: "✨ Your Attendee Hub", p: "Your personal schedule", url: HUB_URL },
      { h: "📌 The Facebook group", p: "Look for the pinned post" }
    ]),
    // Attendee Hub = the personal schedule, so it sits right after "where do I find the links"
    hubSlide(),
    listSlide("theme-light", "How the sessions work", "How the sessions work", [
      "Sessions are pre-recorded. Go to the page at the scheduled time (and refresh!)",
      "We all watch together, and each session is free for 48 hours",
      "<b>Stay for the live Q&amp;A</b><small>45 minutes after the session, with most speakers, on the same page</small>",
      "Use the transcripts and subtitles",
      "Plan ahead at <strong>" + SCHEDULE_URL + "</strong> or in your Attendee Hub"
    ]),
    liveHighlightsSlide()
  ];
  WEEK.forEach(function (day) { slides.push(daySlide(day)); });
  slides.push(
    // Networking sessions and Friday
    networkingSlide(),
    // The Page Builder PowerPack
    listSlide("theme-teal", "Reminder about the PowerPack", "What is the Page Builder PowerPack?", [
      "<b>Lifetime access</b> to every presentation, not just 48 hours",
      "<b>Transcripts, audio recordings and worksheets</b>",
      "<b>Bonuses and extra resources</b> from our speakers",
      "<b>Live networking &amp; co-working</b> sessions"
    ]),
    priceSlide(),
    listSlide("theme-light", "How to decide", "Do you need the PowerPack?", [
      "You can't fit everything into 48 hours",
      "You want to revisit an idea when you're ready to use it",
      "You want the worksheets, transcripts and speaker bonuses",
      "You'd love to join the networking sessions"
    ], { note: "Not sure? Your free summit ticket is yours either way." }),
    // Sponsors / partners + featured speaker
    titleSlide("theme-pink", null, "Page Builder Summit 9.0<br>Is Proudly Supported<br>By Our Partners...", null),
    partnerSlide(),
    simplyDigitalShopsSlide(),
    featuredSpeakerSlide(),
    // Bingo: how it works, then each day's prizes (large format)
    bingoHowSlide()
  );
  WEEK.forEach(function (day) { slides.push(bingoDaySlide(day)); });
  slides.push(
    // Thanks to the presenters, questions, sign-off
    titleSlide("theme-skyblue", null, "Massive Thanks To Our Speakers", "What a line-up! A whole heap of talented people for you to enjoy this week..."),
    titleSlide("theme-light", null, "Any questions?", "Ask away now, or find us in the Facebook group any time"),
    twoUrlSlide("theme-skyblue", "Remember, if you get stuck…", "Everything lives at", [
      { label: "The schedule page", url: SCHEDULE_URL },
      { label: "Your personal schedule: the Attendee Hub", url: HUB_URL }
    ]),
    titleSlide("theme-pink", null, "Have a great week! 💛", null)
  );

  slides.forEach(function (s, i) { s.dataset.index = i; deck.appendChild(s); });

  var dotsWrap = document.getElementById("dots");
  slides.forEach(function (_, i) {
    var d = el("div", "dot");
    d.addEventListener("click", function () { goTo(i); });
    dotsWrap.appendChild(d);
  });

  var current = 0;
  function render() {
    slides.forEach(function (s, i) { s.classList.toggle("active", i === current); });
    Array.prototype.forEach.call(dotsWrap.children, function (d, i) {
      d.classList.toggle("active", i === current);
    });
    document.getElementById("counter").textContent = (current + 1) + " / " + slides.length;
  }
  function goTo(i) { current = Math.max(0, Math.min(slides.length - 1, i)); render(); }
  function next() { goTo(current + 1); }
  function prev() { goTo(current - 1); }

  document.getElementById("btnNext").addEventListener("click", next);
  document.getElementById("btnPrev").addEventListener("click", prev);
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { next(); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { prev(); e.preventDefault(); }
    else if (e.key.toLowerCase() === "f") {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
  });

  render();
})();
</script>
</body>
</html>

<!-- ═══════════════════════════════════════════════════════════════
  FOOTER AUTO-INJECT — for ThriveCart templates that won't let you
  drop a custom-HTML block BELOW the cart.

  This little script builds the footer and appends it to the very
  bottom of the page, so it always sits under the checkout and runs
  full width — no editor drop-zone required.

  WHERE IT GOES: it's already bundled into custom-css-paste-ready.html
  (right after the </style>). So if you paste that whole file into
  Checkout → Tracking → "All pages", the footer appears automatically
  and you do NOT need to place Block 7 by hand.

  TO EDIT: change the links / text in the innerHTML string below, then
  re-paste. Replace the "#" placeholders with your real URLs.
═══════════════════════════════════════════════════════════════ -->
<script>
(function () {
  function addFooter() {
    if (document.getElementById('sds-footer-injected')) return; // once only
    var f = document.createElement('div');
    f.id = 'sds-footer-injected';
    f.className = 'sds-block sds-footer';
    f.innerHTML =
      '<div class="sds-container"><p>' +
        '&copy; Simply Digital Design &nbsp;&middot;&nbsp; ' +
        '<a href="#">Privacy Policy</a> &nbsp;&middot;&nbsp; ' +
        '<a href="#">Terms of Service</a> &nbsp;&middot;&nbsp; ' +
        '<a href="#">Our Main Website</a>' +
      '</p></div>';
    document.body.appendChild(f);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', addFooter);
  } else {
    addFooter();
  }
})();
</script>

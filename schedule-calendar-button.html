<!--
  PBS Attendee Hub - Calendar subscribe buttons for the general (public)
  schedule page
  ===========================================================================
  Drop this whole block into a "Custom HTML" widget/block on the existing
  WordPress schedule page. It does not touch anything else on the page.

  This subscribes visitors to the live "Page Builder Summit 9.0" Google
  Calendar (not a one-time download) — if a session time changes, everyone
  who's subscribed sees the update automatically, no re-download needed.

  - "Add to Google Calendar": one click, opens Google's add-calendar
    prompt pre-filled, visitor just confirms.
  - "Subscribe in Apple Calendar / Outlook": a webcal:// link, which those
    apps open directly as a subscribe action (not a one-time file import).

  To change what's actually in the calendar (add/edit/remove events), do
  that in Google Calendar itself — this block only links to it.
-->
<div class="pbs-cal-widget">
  <a href="https://calendar.google.com/calendar/render?cid=6d755c3313c89337fb4d7930e3b0b3878879a773b76f39971922428b9dc77c85%40group.calendar.google.com" target="_blank" rel="noopener" class="pbs-cal-btn pbs-cal-btn-primary">Add to Google Calendar</a>
  <a href="webcal://calendar.google.com/calendar/ical/6d755c3313c89337fb4d7930e3b0b3878879a773b76f39971922428b9dc77c85%40group.calendar.google.com/public/basic.ics" class="pbs-cal-btn pbs-cal-btn-outline">Subscribe in Apple Calendar / Outlook</a>
  <p class="pbs-cal-note">Subscribing keeps your calendar in sync automatically — if a session time ever changes, you'll see the update without doing anything.</p>
</div>

<style>
  .pbs-cal-widget { font-family: 'Open Sans', Arial, sans-serif; max-width: 520px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .pbs-cal-btn {
    display: inline-block; border-radius: 10px; padding: 14px 22px; font-family: 'Montserrat', Arial, sans-serif;
    font-weight: 700; font-size: 14px; text-decoration: none; transition: opacity 0.15s ease;
  }
  .pbs-cal-btn:hover { opacity: 0.88; }
  .pbs-cal-btn-primary { background: #D85A95; color: #fff; }
  .pbs-cal-btn-outline { background: #fff; color: #D85A95; border: 1.5px solid #D85A95; }
  .pbs-cal-note { flex-basis: 100%; font-size: 13px; color: #666666; margin: 4px 0 0; line-height: 1.5; }
</style>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Builder Summit 9.0 — Closing Call Slides</title>
<!--
  PBS 9.0 — Closing call slide deck (separate from the kickoff-call deck)
  =======================================================================
  Follows the PBS 7.0 closing call outline, updated for this year: bingo instead of
  quizzes, the PowerPack instead of the All-Access Pass, and the Attendee Hub for the
  action plan.  Same look and controls as the kickoff deck.

  THINGS TO FILL IN (search for these names in the script):
    FEEDBACK_URL   the feedback form link (the feedback slide shows a fallback until set)
    BINGO_WINNERS  winners per prize, e.g.  Monday: ["Name 1", "Name 2", "Name 3"]
    WHATS_NEXT     the GID Week details (that slide only appears once this is filled in)

  NAVIGATION: arrow keys / space / click the left-right edges / on-screen buttons / dots.
  Press "F" for fullscreen (handy when screen-sharing on the call).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #D85A95;
    --pink-dark: #CC4E89;
    --blue: #25AAE1;
    --blue-dark: #199ED5;
    --navy: #312E61;
    --teal: #75B8A1;
    --teal-dark: #5FA088;
    --white: #ffffff;
    --off-white: #FBFCFE;
    --light-blue: #E2F0FB;
    --text-light: rgba(255,255,255,0.85);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: 'Open Sans', sans-serif; background: var(--navy);
  }
  h1, h2, h3, h4 { font-family: 'Montserrat', sans-serif; margin: 0; }

  /* ---------- Deck shell ---------- */
  .deck { position: relative; width: 100%; height: 100vh; }
  .slide {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 6vh 8vw;
  }
  .slide.active { display: flex; }

  /* Slide background themes — no dark navy backgrounds */
  .theme-skyblue { background: var(--light-blue); color: var(--navy); }
  .theme-pink   { background: linear-gradient(135deg, var(--pink) 0%, var(--pink-dark) 100%); color: #fff; }
  .theme-light  { background: var(--off-white); color: var(--navy); }
  .theme-teal   { background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%); color: #fff; }

  .eyebrow {
    font-family: 'Montserrat', sans-serif; font-size: clamp(13px, 1.4vw, 16px); font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase; opacity: 0.85; margin-bottom: 18px;
  }
  .theme-light .eyebrow, .theme-skyblue .eyebrow { color: var(--pink-dark); }

  .slide h1 { font-size: clamp(34px, 5.5vw, 76px); font-weight: 900; line-height: 1.08; }
  .slide h2 { font-size: clamp(26px, 3.6vw, 48px); font-weight: 800; line-height: 1.15; }
  .slide .sub { font-size: clamp(16px, 1.8vw, 24px); font-weight: 500; margin-top: 18px; opacity: 0.92; max-width: 900px; }
  .slide .big-url {
    font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: clamp(22px, 3.2vw, 42px);
    margin-top: 28px; padding: 14px 32px; border-radius: 999px; background: rgba(255,255,255,0.14);
    letter-spacing: 0.5px; word-break: break-word;
  }
  .theme-light .big-url, .theme-skyblue .big-url { background: rgba(49,46,97,0.08); color: var(--navy); }

  .logo-row img { height: 52px; margin-bottom: 28px; }

  /* ---------- Large-format list slides ---------- */
  .big-list { list-style: none; margin: 26px 0 0; padding: 0; max-width: 1050px; text-align: left; counter-reset: n; }
  .big-list li { font-size: clamp(20px, 2.5vw, 36px); font-weight: 600; line-height: 1.3; padding: 11px 0 11px 56px; position: relative; }
  .big-list li::before { content: "\2713"; position: absolute; left: 0; top: 11px; font-weight: 900; color: var(--pink); }
  .big-list.numbered li::before {
    counter-increment: n; content: counter(n); width: 38px; height: 38px; border-radius: 50%; top: 14px;
    background: var(--pink); color: #fff; font-size: 0.7em; display: flex; align-items: center; justify-content: center;
  }
  .theme-pink .big-list li::before, .theme-teal .big-list li::before { color: #fff; }
  .theme-pink .big-list.numbered li::before { background: #fff; color: var(--pink-dark); }
  .big-list li small { display: block; font-size: 0.6em; font-weight: 500; opacity: 0.8; margin-top: 2px; }
  .big-list.prizes li { font-size: clamp(24px, 3.2vw, 46px); font-weight: 700; padding: 16px 0 16px 64px; line-height: 1.25; border-top: 1px solid rgba(49,46,97,0.14); }
  .big-list.prizes li:first-child { border-top: none; }
  .big-list.prizes li::before { content: "\2605"; top: 16px; }
  .big-list.compact { margin-top: 18px; }
  .big-list.compact li { font-size: clamp(18px, 2.1vw, 30px); padding: 7px 0 7px 52px; }
  .big-list.compact li::before { top: 7px; }
  .pp-price { background: var(--white); color: var(--navy); border-radius: 16px; padding: 12px 30px; margin-top: 20px; font-size: clamp(17px, 2vw, 28px); font-weight: 600; }
  .pp-price .amt { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 1.6em; color: var(--pink-dark); vertical-align: -0.1em; }
  .slide .note { font-size: clamp(16px, 1.7vw, 24px); font-weight: 600; margin-top: 22px; opacity: 0.9; }

  /* ---------- Partner slide ---------- */
  .sponsor-card {
    background: var(--white); border: 2px solid rgba(117,184,161,0.5); border-radius: 18px;
    padding: 36px 56px 40px; max-width: 860px; text-align: center;
  }
  .sponsor-card .tag {
    display: inline-block; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 13px;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--teal); margin-bottom: 8px;
  }
  /* The logo PNG has a lot of transparent padding: cover-crop it to the middle band. */
  .sponsor-logo { width: 480px; max-width: 100%; height: 190px; margin: 0 auto 14px; overflow: hidden; }
  .sponsor-logo img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .sponsor-logo.fit { height: auto; max-height: 190px; display: flex; align-items: center; justify-content: center; }
  .sponsor-logo.fit img { width: auto; height: auto; max-width: 100%; max-height: 190px; object-fit: contain; }
  .sponsor-card.featured { max-width: 960px; padding: 30px 56px 34px; }
  .sponsor-card.featured .sponsor-logo.fit, .sponsor-card.featured .sponsor-logo.fit img { max-height: 110px; }
  .sponsor-card.featured p.small { font-size: 17px; line-height: 1.5; }
  .sponsor-card.logo-only { padding: 40px 72px 44px; }
  .sponsor-card h2 { color: var(--navy); font-size: 30px; margin: 4px 0 6px; }
  .sponsor-card .session { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 20px; line-height: 1.35; color: var(--pink-dark); margin: 0 0 6px; }
  .sponsor-card .when { font-size: 16px; opacity: 0.8; margin: 0 0 14px; }
  .sponsor-card p.small { font-size: 18px; }
  .sponsor-card p { color: var(--navy); font-size: 21px; line-height: 1.55; margin: 0 0 14px; }
  .sponsor-card p:last-child { margin-bottom: 0; }
  .sponsor-card a { color: var(--blue); font-weight: 700; text-decoration: none; }

  /* ---------- Nav controls ---------- */
  .nav-btn {
    position: fixed; top: 50%; transform: translateY(-50%); width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,0.12); border: none; color: #fff; font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: background 0.15s ease; z-index: 10;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.25); }
  .nav-prev { left: 18px; } .nav-next { right: 18px; }
  body:has(.slide.active.theme-light) .nav-btn,
  body:has(.slide.active.theme-skyblue) .nav-btn { color: var(--navy); background: rgba(49,46,97,0.08); }
  body:has(.slide.active.theme-light) .nav-btn:hover,
  body:has(.slide.active.theme-skyblue) .nav-btn:hover { background: rgba(49,46,97,0.16); }

  .dots { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; transition: background 0.15s ease, transform 0.15s ease; }
  .dot.active { background: #fff; transform: scale(1.3); }
  body:has(.slide.active.theme-light) .dot,
  body:has(.slide.active.theme-skyblue) .dot { background: rgba(49,46,97,0.22); }
  body:has(.slide.active.theme-light) .dot.active,
  body:has(.slide.active.theme-skyblue) .dot.active { background: var(--navy); }

  .counter {
    position: fixed; top: 18px; right: 24px; font-family: 'Montserrat', sans-serif; font-weight: 700;
    font-size: 13px; color: rgba(255,255,255,0.6); z-index: 10;
  }
  body:has(.slide.active.theme-light) .counter,
  body:has(.slide.active.theme-skyblue) .counter { color: rgba(49,46,97,0.45); }
</style>
</head>
<body>

<div class="deck" id="deck"></div>

<button class="nav-btn nav-prev" id="btnPrev" aria-label="Previous slide">‹</button>
<button class="nav-btn nav-next" id="btnNext" aria-label="Next slide">›</button>
<div class="dots" id="dots"></div>
<div class="counter" id="counter"></div>

<script>
(function () {
  var LOGO_URL = "https://pagebuildersummit.com/wp-content/uploads/2021/03/cropped-Asset-1.png";

  /* =========================================================
     THINGS TO FILL IN
  ========================================================= */
  var FEEDBACK_URL = "";   // e.g. "pagebuildersummit.com/feedback/"  (leave empty until you have the link)
  // Winners, in the same order as that day's prizes. Leave a day out until it is drawn.
  var BINGO_WINNERS = {
    // Monday: ["Name 1", "Name 2", "Name 3"],
  };
  // What's next (e.g. GID Week). No slide is shown until this is filled in:
  //   var WHATS_NEXT = { eyebrow: "What's next", title: "GID Week", text: "…", url: "pagebuildersummit.com/…" };
  var WHATS_NEXT = null;

  var SCHEDULE_URL = "pagebuildersummit.com/schedule/";
  var HUB_URL = "pagebuildersummit.com/attendee-hub/";
  var BINGO_URL = "pagebuildersummit.com/bingo/";
  var POWERPACK_URL = "pagebuildersummit.com/page-builder-powerpack-early-bird/";

  var BINGO_DAYS = [
    { label: "Monday", bingo: [
        "60-Minute Marketing Strategy Call with Shannon Mattern ($500 value)",
        "The Course Hub Build Kit — Kinsey Soderberg ($597)",
        "$20 Amazon Gift Card"
      ] },
    { label: "Tuesday", bingo: [
        "Hire to Grow by Eric Dingler, winner's choice of format ($9.99)",
        "The One Week Website Starter Pack — Whitney Zimmermann ($297)",
        "BTS My ClickUp System & Web Design Workflow — Alexia Lynn ($97)"
      ] },
    { label: "Wednesday", bingo: [
        "Private 1-Hour Call with Sam Sarsten ($250)",
        "Rose Sales Page Template — Chantal Edouard-Betsy ($147)",
        "$20 Amazon Gift Card"
      ] },
    { label: "Thursday", bingo: [
        "1:1 Online Advent Calendar Strategy Session — Britta Just (180 €)",
        "Signed copies of Sell Futures, Not Features and Five Figure Funnels — Mike Killen",
        "$20 Amazon Gift Card"
      ] },
    { label: "Friday", bingo: [
        "1-Hour WordPress Consultancy with Jakson ($95)",
        "30-Minute Live Call with Dyllon Boynton: Build and Fix Pages with AI ($150)",
        "Build It With Me: 1:1 Automation Session — Anchen ($397)"
      ] }
  ];

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  function titleSlide(theme, eyebrow, titleHtml, subHtml) {
    var s = el("div", "slide " + theme);
    var wrap = el("div", "logo-row");
    var img = document.createElement("img");
    img.src = LOGO_URL; img.alt = "Page Builder Summit";
    if (theme === "theme-light") img.style.filter = "none";
    wrap.appendChild(img);
    s.appendChild(wrap);
    if (eyebrow) s.appendChild(el("div", "eyebrow", eyebrow));
    s.appendChild(el("h1", null, titleHtml));
    if (subHtml) s.appendChild(el("div", "sub", subHtml));
    return s;
  }

  function urlSlide(theme, eyebrow, titleHtml, url) {
    var s = el("div", "slide " + theme);
    if (eyebrow) s.appendChild(el("div", "eyebrow", eyebrow));
    s.appendChild(el("h1", null, titleHtml));
    s.appendChild(el("div", "big-url", url));
    return s;
  }

  function partnerSlide() {
    var s = el("div", "slide theme-light");
    var card = el("div", "sponsor-card");
    card.appendChild(el("div", "tag", "Proudly supported by our partner"));
    var logo = el("div", "sponsor-logo");
    var img = document.createElement("img");
    img.src = "https://i0.wp.com/pagebuildersummit.com/wp-content/uploads/2026/10/show.fm-podcasting-made-easier.png?w=1000&quality=80&ssl=1";
    img.alt = "show.fm";
    logo.appendChild(img);
    card.appendChild(logo);
    card.appendChild(el("p", null,
      "<strong>show.fm</strong> is a brand new way to make podcasts. All the tools you need to succeed, one account. " +
      "Book guests, produce the episodes, automate the dull things, publish everywhere, and measure your show\u2019s success from one place. " +
      "Now you can spend your time on the conversation."));
    card.appendChild(el("p", null,
      "There\u2019s nothing like it, and you can catch their limited-time deal at <a href=\"https://show.fm/\">show.fm</a>"));
    s.appendChild(card);
    return s;
  }

  function simplyDigitalShopsSlide() {
    var s = el("div", "slide theme-light");
    var card = el("div", "sponsor-card logo-only");
    card.appendChild(el("div", "tag", "Proudly supported by our partner"));
    var logo = el("div", "sponsor-logo fit");
    var img = document.createElement("img");
    img.src = "https://pagebuildersummit.com/wp-content/uploads/2026/10/Simply-Digital-Shops-Logo.png";
    img.alt = "Simply Digital Shops";
    logo.appendChild(img);
    card.appendChild(logo);
    s.appendChild(card);
    return s;
  }

  // Rache's bio (left out of the slide if this is ever emptied).

  function listSlide(theme, eyebrow, titleHtml, items, opts) {
    opts = opts || {};
    var s = el("div", "slide " + theme);
    if (eyebrow) s.appendChild(el("div", "eyebrow", eyebrow));
    s.appendChild(el("h2", null, titleHtml));
    var ul = el("ul", "big-list" + (opts.numbered ? " numbered" : "") + (opts.prizes ? " prizes" : ""));
    items.forEach(function (t) { ul.appendChild(el("li", null, t)); });
    s.appendChild(ul);
    if (opts.note) s.appendChild(el("div", "note", opts.note));
    return s;
  }

  function bingoDaySlide(day, i) {
    var winners = BINGO_WINNERS[day.label] || [];
    var items = day.bingo.map(function (prize, k) {
      return winners[k] ? prize + "<small>Winner: <strong>" + winners[k] + "</strong></small>" : prize;
    });
    // alternate white / light blue so the prize slides stay light
    return listSlide(i % 2 === 0 ? "theme-light" : "theme-skyblue", "Bingo prizes", day.label + "'s prizes", items, { prizes: true });
  }

  function powerPackSlide() {
    var s = listSlide("theme-teal", "Keep everything", "The Page Builder PowerPack", [
      "<b>Lifetime access</b> to every presentation, not just 48 hours",
      "<b>Transcripts, audio recordings and worksheets</b>",
      "<b>Bonuses and extra resources</b> from our speakers",
      "<b>Live networking &amp; co-working</b> sessions"
    ]);
    s.querySelector(".big-list").className += " compact";
    s.appendChild(el("div", "pp-price", "<span class=\"amt\">$147</span> for lifetime access"));
    var u = el("div", "big-url", POWERPACK_URL);
    u.style.fontSize = "clamp(15px, 2vw, 26px)";
    u.style.marginTop = "16px";
    s.appendChild(u);
    return s;
  }

  function whatsNextSlide() {
    if (!WHATS_NEXT) return null;
    var s = el("div", "slide theme-skyblue");
    if (WHATS_NEXT.eyebrow) s.appendChild(el("div", "eyebrow", WHATS_NEXT.eyebrow));
    s.appendChild(el("h1", null, WHATS_NEXT.title));
    if (WHATS_NEXT.text) s.appendChild(el("div", "sub", WHATS_NEXT.text));
    if (WHATS_NEXT.url) s.appendChild(el("div", "big-url", WHATS_NEXT.url));
    return s;
  }

  function feedbackSlide() {
    if (FEEDBACK_URL) return urlSlide("theme-light", "Tell us what you thought", "We'd love your feedback", FEEDBACK_URL);
    return titleSlide("theme-light", "Tell us what you thought", "We'd love your feedback", "We'll drop the feedback link in the chat and in the post below");
  }

  /* =========================================================
     BUILD DECK  (order follows the closing call outline)
  ========================================================= */
  var deck = document.getElementById("deck");
  var slides = [
    // Welcome
    titleSlide("theme-skyblue", "Page Builder Summit 9.0", "Welcome to the<br>Closing Call<br><em style=\"color:var(--pink); font-style:normal;\">What's Working Now</em>", "Friday 6 November · What a week! 🎉"),
    titleSlide("theme-light", null, "What was your favourite<br>presentation this week?", "Tell us in the comments. We'd love to hear what's working for you!"),
    listSlide("theme-skyblue", "What we'll cover", "Today's closing call", [
      "Moving forward: your action plan",
      "Getting the most from the PowerPack",
      "The bingo prize draw",
      "Your feedback"
    ], { numbered: true }),
    listSlide("theme-light", "Still catching up?", "Presentations are still open", [
      "Each presentation is free to watch for <b>48 hours</b> after it goes live",
      "Your Attendee Hub shows what's still open<small>" + HUB_URL + "</small>"
    ]),
    // Moving forward + action plan
    titleSlide("theme-teal", null, "This summit won't do anything for you<br>if you don't take action", null),
    listSlide("theme-light", "Moving forward", "Build your action plan", [
      "Break down what you learned and what you need to act on",
      "Take it one presentation at a time",
      "Put the tasks in your calendar",
      "Rewatch presentations while you're implementing"
    ], { numbered: true }),
    listSlide("theme-skyblue", "Your Attendee Hub", "Your plan and notes are waiting", [
      "<b>My plan:</b> your sessions, in your own time zone",
      "<b>Notes:</b> everything you jotted down, ready to download",
      "<strong>" + HUB_URL + "</strong>"
    ]),
    // The PowerPack
    listSlide("theme-teal", "The Page Builder PowerPack", "Getting the most from it", [
      "<b>Check it first</b> if you need a resource or a quick training",
      "<b>Use it for your action plan</b> and rewatch as you go",
      "<b>Go back to the presentations</b> that weren't a priority this week",
      "<b>Use the bonus resources</b>"
    ]),
    powerPackSlide(),
    // Bingo prize draw
    titleSlide("theme-pink", null, "Time for the<br>bingo prize draw! 🎉", null)
  ];
  BINGO_DAYS.forEach(function (day, i) { slides.push(bingoDaySlide(day, i)); });
  slides.push(
    // Thank yous
    partnerSlide(),
    simplyDigitalShopsSlide(),
    titleSlide("theme-skyblue", null, "Massive Thanks To Our Speakers", "What a line-up! A whole heap of talented people for you to enjoy this week..."),
    titleSlide("theme-teal", null, "A big thank you to<br>Sunita &amp; Britta", null),
    // Feedback, questions, goodbye
    feedbackSlide(),
    whatsNextSlide(),
    titleSlide("theme-skyblue", null, "Any questions?", "Ask away now, or find us in the Facebook group any time"),
    titleSlide("theme-pink", null, "Thank you for an<br>amazing week! 💛", null)
  );
  slides = slides.filter(Boolean);   // drops slides that have nothing to show yet (e.g. What's next)

  slides.forEach(function (s, i) { s.dataset.index = i; deck.appendChild(s); });

  var dotsWrap = document.getElementById("dots");
  slides.forEach(function (_, i) {
    var d = el("div", "dot");
    d.addEventListener("click", function () { goTo(i); });
    dotsWrap.appendChild(d);
  });

  var current = 0;
  function render() {
    slides.forEach(function (s, i) { s.classList.toggle("active", i === current); });
    Array.prototype.forEach.call(dotsWrap.children, function (d, i) {
      d.classList.toggle("active", i === current);
    });
    document.getElementById("counter").textContent = (current + 1) + " / " + slides.length;
  }
  function goTo(i) { current = Math.max(0, Math.min(slides.length - 1, i)); render(); }
  function next() { goTo(current + 1); }
  function prev() { goTo(current - 1); }

  document.getElementById("btnNext").addEventListener("click", next);
  document.getElementById("btnPrev").addEventListener("click", prev);
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { next(); e.preventDefault(); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { prev(); e.preventDefault(); }
    else if (e.key.toLowerCase() === "f") {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
  });

  render();
})();
</script>
</body>
</html>
